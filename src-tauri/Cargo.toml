[package]
name = "nexus-launcher"
version = "0.1.0"
edition = "2021"
description = "Controller-first universal gaming launcher"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
env_logger = "0.11.11"
gilrs = "0.11.2"
log = "0.4.35"
parking_lot = "0.13.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.5.5"
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
